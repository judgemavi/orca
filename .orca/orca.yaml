# Project identity and branch settings
project:
  name: orca
  integration_branch: orca/integration
  worktree_dir: .orca/worktrees
# CLI tool adapters — binary paths, args, models, timeouts
tools:
  claude:
    binary: claude
    model: claude-opus-4-6
    models:
      - claude-opus-4-6
      - claude-sonnet-4-6
      - claude-haiku-4-5-20251001
      - claude-opus-4-5-20251101
      - claude-sonnet-4-5-20250929
    interactive_args:
      - --mcp-config
      - '{{mcp_config}}'
      - --allowedTools
      - '{{allowed_tools}}'
      - --append-system-prompt
      - '{{context}}'
    headless_args:
      - -p
      - '{{prompt}}'
      - --output-format
      - json
      - --permission-mode
      - bypassPermissions
    resume_args:
      - --resume
      - '{{session_id}}'
      - -p
      - '{{feedback}}'
      - --output-format
      - json
      - --permission-mode
      - bypassPermissions
    session_id_pattern: '"session_id":\s*"([^"]+)"'
    timeout: 600s
    mode: headless
    prompt_mode: arg
    output:
      mode: json_envelope
      result_field: result
    cost:
      mode: json_field
      cost_field: total_cost_usd
      usage_input: usage.input_tokens
      usage_output: usage.output_tokens
  codex:
    binary: codex
    model: gpt-5.3-codex
    models:
      - gpt-5.3-codex
      - gpt-5.2-codex
      - gpt-5.1-codex-max
      - gpt-5.1-codex
      - gpt-5-codex
      - gpt-5-codex-mini
    interactive_args:
      - -a
      - never
      - '{{context}}'
    headless_args:
      - exec
      - '{{prompt}}'
      - --full-auto
    resume_args:
      - exec
      - resume
      - '{{session_id}}'
      - '{{feedback}}'
      - --full-auto
    session_id_pattern: 'session id: ([a-f0-9-]+)'
    timeout: 600s
    mode: headless
    prompt_mode: arg
    output:
      mode: stdout
    cost:
      mode: none
# Default tool and model used when not overridden per-phase
defaults:
  tool: claude
  model: ""
# Commands to run after integration (e.g. test suites)
validation:
  commands: []
# Parallel worker settings
workers:
  max_parallel: 3
# Supervisor agent config — tool, model, cost budget, per-phase overrides
orchestrator:
  cost_budget: 0
  supervisor_tool: claude
  supervisor_model: ""
  phases:
    explore:
      tool: claude
      model: ""
    integrate:
      tool: codex
      model: ""
    review:
      tool: claude
      model: "claude-sonnet-4-6"
    sprint:
      tool: codex
      model: ""
# Stuck detection, conflict checking, per-task budget
monitor:
  stuck_check_interval: 30s
  max_stuck_cycles: 3
  conflict_check_interval: 15s
  task_budget: 0
# Quality gates applied during review
quality:
  enabled: true
  scope_check: true
  test_delta: true
  alignment_check: false
# Worktree cleanup settings
cleanup:
  ttl: 168h
# Web UI server settings
server:
  addr: :8080
