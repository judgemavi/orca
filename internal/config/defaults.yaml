project:
  integration_branch: orca/integration
  worktree_dir: .orca/worktrees

tools:
  claude:
    binary: claude
    models:
      - claude-opus-4-6
      - claude-sonnet-4-6
      - claude-haiku-4-5-20251001
      - claude-opus-4-5-20251101
      - claude-sonnet-4-5-20250929
    interactive_args:
      - "--append-system-prompt"
      - "{{context}}"
    headless_args:
      - "-p"
      - "{{prompt}}"
      - "--output-format"
      - json
      - "--permission-mode"
      - bypassPermissions
    session_id_pattern: '"session_id":\s*"([^"]+)"'
    resume_args:
      - "--resume"
      - "{{session_id}}"
      - "-p"
      - "{{feedback}}"
      - "--output-format"
      - json
      - "--permission-mode"
      - bypassPermissions
    mode: headless
    prompt_mode: arg
    timeout: 600s
    output:
      mode: json_envelope
      result_field: result
    cost:
      mode: json_field
      cost_field: total_cost_usd
      usage_input: usage.input_tokens
      usage_output: usage.output_tokens

  codex:
    binary: codex
    models:
      - gpt-5.3-codex
      - gpt-5.2-codex
      - gpt-5.1-codex-max
      - gpt-5.1-codex
      - gpt-5-codex
      - gpt-5-codex-mini
    headless_args:
      - exec
      - "{{prompt}}"
      - "--full-auto"
    session_id_pattern: 'session id: ([a-f0-9-]+)'
    resume_args:
      - exec
      - resume
      - "{{session_id}}"
      - "{{feedback}}"
      - "--full-auto"
    mode: headless
    prompt_mode: arg
    timeout: 600s
    output:
      mode: stdout
    cost:
      mode: none

workers:
  max_parallel: 3

orchestrator:
  cost_budget: 0
  supervisor_tool: claude

defaults:
  tool: claude

monitor:
  stuck_check_interval: 30s
  max_stuck_cycles: 3
  conflict_check_interval: 15s
  task_budget: 0

quality:
  enabled: true
  scope_check: true
  test_delta: true
  alignment_check: false

cleanup:
  ttl: 168h
